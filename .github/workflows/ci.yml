name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the owner develops on Windows-native Node.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned by commit SHA; Dependabot keeps the pins and comments current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm pinned in package.json (native binary, signature-checked), Node from
      # .node-version, and runs pnpm install --frozen-lockfile.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      # Generated code must match the schemas in packages/contracts: regenerate it and fail on
      # any difference. --intent-to-add makes new, uncommitted generated files show up too.
      - run: pnpm gen
      - run: git add --intent-to-add --all && git diff --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds what has a build script: the webapp (apps/web/dist, about a second) and the mapper
      # app's iOS JavaScript export (Metro and Hermes bytecode plus the map's DOM-component bundle,
      # about 17 s cold on the owner's PC).
      - run: pnpm build
      # pnpm 12 writes a two-document lockfile that GitHub's dependency graph can't read yet
      # (dependabot/dependabot-core#15904), so Dependabot alerts miss npm packages. Audit here.
      - if: runner.os == 'Linux'
        run: pnpm audit --audit-level high

  ios:
    # The capture module's native code (ADR 0007, ADR 0010): the SwiftPM tests, an unsigned build
    # of the whole app, and the encoder check on the module's compiled objects. No signing and no
    # secrets: nothing here can reach a phone.
    name: iOS native (macOS)
    runs-on: macos-26
    timeout-minutes: 75
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          ls -d /Applications/Xcode*.app
      # CaptureCore and the other pure-Swift targets, with Swift Testing.
      - name: SwiftPM tests
        run: swift test --package-path apps/mapper/modules/capture-native
      # Nothing else compiles packages/contracts' generated Swift yet.
      - name: Generated Swift types compile
        run: xcrun swiftc -typecheck packages/contracts/generated/swift/Contracts.swift
      # The check must catch a planted encoder symbol and a planted CIContext writer selector.
      - name: Encoder check catches planted calls
        run: node apps/mapper/scripts/encoder-check.mts --self-test apps/mapper/modules/capture-native/ci/planted
      - name: Prebuild the iOS project
        working-directory: apps/mapper
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/mapper/ios
        run: pod install
      - name: Build the app (unsigned, Debug)
        working-directory: apps/mapper/ios
        run: |
          workspace=$(ls -d *.xcworkspace)
          xcodebuild build -quiet -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
      # Every pod the module's expo-module.config.json lists. Once the recorder exists, this build
      # must compile it too (USG_RECORDER), or its objects go unchecked.
      - name: Encoder check on the capture module
        run: node apps/mapper/scripts/encoder-check.mts --derived-data "$RUNNER_TEMP/dd"

  swift-linux:
    # CaptureCore is Foundation only, so it must also build and pass its tests with the Swift
    # toolchain on Linux (ADR 0010), the toolchain Windows and WSL would use.
    name: Swift on Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.3.3-noble@sha256:c2f3ac2eb806ce43f68859c3d52bd3bb1cfc88672fb3a948b76e136d98e39278
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test --package-path apps/mapper/modules/capture-native
      - run: swiftc -typecheck packages/contracts/generated/swift/Contracts.swift

  db:
    # Branch protection requires the two check names above; add this one there to require it.
    # The name stays "Database (postgis)" although the job now runs RustFS too, for the API's
    # stack tests (services/api/test/stack/).
    name: Database (postgis)
    # Linux only: Windows runners can't run Linux service containers.
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      # The service containers below. pnpm migrate creates the usg database, pnpm buckets the
      # buckets. The S3 key pair is RustFS's root user, as in .env.example; CI-only values.
      DATABASE_URL: postgres://usg:usg-ci@localhost:5432/usg?sslmode=disable
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: usg-ci
      S3_SECRET_ACCESS_KEY: usg-ci-secret
      S3_BUCKET_BUNDLES: usg-bundles
      S3_BUCKET_EXPORTS: usg-exports
      S3_BUCKET_PUBLIC: usg-public
    services:
      postgis:
        # The same pinned image as docker-compose.yml (db/test/unit/stack.test.ts checks).
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: usg
          POSTGRES_PASSWORD: usg-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U usg -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      rustfs:
        # The same pinned image as docker-compose.yml (db/test/unit/stack.test.ts checks).
        image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          # Service containers can't read the job's env: keep these in step with S3_* above.
          RUSTFS_ACCESS_KEY: usg-ci
          RUSTFS_SECRET_KEY: usg-ci-secret
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm migrate
      - run: pnpm buckets
      - run: pnpm test:db
      # db/schema.sql must match the migrations: regenerate it and fail on any difference.
      # pg_dump runs inside the service container, so it matches the server's version.
      - run: pnpm db dump
        env:
          PG_CONTAINER: ${{ job.services.postgis.id }}
      - run: git diff --exit-code db/schema.sql
